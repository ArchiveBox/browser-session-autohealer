#ac-research-console .ac-legend-ring{width:8px;height:8px;border:2px solid var(--ac-muted);border-radius:50%}
#ac-research-console .ac-lineage{--ac-rail:168px;position:relative;padding:0 10px 12px}
#ac-research-console .ac-lineage-svg{position:absolute;top:0;left:10px;max-width:none;pointer-events:none;z-index:1;overflow:visible}
#ac-research-console .ac-branch-path{pointer-events:stroke}
#ac-research-console .ac-lineage-row{width:100%;display:grid;grid-template-columns:var(--ac-rail) minmax(0,1fr) auto;gap:0;align-items:center;padding:7px 5px 7px 0;min-height:47px;border:0;border-radius:4px;background:transparent;color:var(--ac-ink);text-align:left}
#ac-research-console .ac-lineage-row:hover{background:var(--ac-soft)}
#ac-research-console .ac-lineage-row.ac-failure-row{background:var(--ac-red-bg)}
#ac-research-console .ac-lineage-row.ac-leader-row{background:var(--ac-green-bg)}
#ac-research-console .ac-row-rail{height:1px;width:var(--ac-rail);display:block}
#ac-research-console .ac-lane-heading{height:43px;display:grid;width:var(--ac-rail);grid-template-columns:repeat(6,1fr);font:10px/1.4 ui-monospace,SFMono-Regular,monospace;color:var(--ac-muted);align-items:center;text-align:center}
#ac-research-console .ac-lineage-copy{min-width:0;padding-right:12px}
#ac-research-console .ac-lineage-title{font-size:12px;font-weight:500}
#ac-research-console .ac-lineage-copy .ac-detail-line{margin-top:2px;font-size:10px}
#ac-research-console .ac-lineage-meta{display:grid;gap:3px;text-align:right;color:var(--ac-muted)}
#ac-research-console .ac-hashtext{font:10px ui-monospace,SFMono-Regular,monospace;color:var(--ac-green)}
#ac-research-console .ac-comparepick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end;margin:22px 0 12px}
#ac-research-console .ac-compare-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#ac-research-console .ac-diff-table td{vertical-align:top;max-width:330px;overflow-wrap:anywhere}
#ac-research-console .ac-diff-before{background:color-mix(in srgb,var(--ac-red-bg) 65%,var(--ac-surface))}
#ac-research-console .ac-diff-after{background:color-mix(in srgb,var(--ac-green-bg) 65%,var(--ac-surface))}
#ac-research-console .ac-diff-table td:first-child{min-width:155px}
@media(max-width:850px){#ac-research-console .ac-lineage{--ac-rail:128px}#ac-research-console .ac-lineage-meta .ac-mono{font-size:10px}#ac-research-console .ac-lineage-row{min-height:53px}}
@media(max-width:620px){#ac-research-console .ac-lineage{--ac-rail:83px;padding-inline:4px}#ac-research-console .ac-lineage-svg{left:4px}#ac-research-console .ac-lineage-row{grid-template-columns:var(--ac-rail) minmax(0,1fr);padding:8px 3px 8px 0;min-height:65px}#ac-research-console .ac-lineage-meta{grid-column:2;display:flex;text-align:left;margin-top:3px;gap:10px}#ac-research-console .ac-lane-heading{height:26px;display:block;text-align:left;padding:5px}#ac-research-console .ac-lane-heading span:not(:first-child){display:none}#ac-research-console .ac-lineage-copy{padding-right:0}#ac-research-console .ac-lineage-title{font-size:11px}#ac-research-console .ac-comparepick,#ac-research-console .ac-compare-cards{grid-template-columns:1fr}#ac-research-console .ac-comparepick>.ac-btn{justify-self:start}#ac-research-console .ac-graph-legend{gap:8px;font-size:10px}}

</style>
<script>
(()=>{
const root=document.getElementById('ac-research-console');
const ic=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(label,type='')=>`<span class="ac-badge ${type?'ac-'+type:''}"><span class="ac-dot"></span>${esc(label)}</span>`;
const btn=(label,action,icon='',primary=false,extra='')=>`<button type="button" class="ac-btn ${primary?'ac-btn-primary':''}" data-action="${action}" ${extra}>${icon?ic(icon):''}${esc(label)}</button>`;
const link=(label,action)=>`<button type="button" class="ac-link" data-action="${action}">${esc(label)}</button>`;
const pInitial=[{id:'maya',name:'Maya · EU monitoring',short:'Maya',initials:'MK',path:'/personas/maya-eu',location:'Geneva / CH',rev:42,timezone:'Europe/Zurich',locale:'en-GB',runtime:'Local',sync:'2 destinations',updated:'2 min ago'},{id:'noah',name:'Noah · MENA research',short:'Noah',initials:'NA',path:'/personas/noah-mena',location:'Brussels / BE',rev:18,timezone:'Europe/Brussels',locale:'en-GB',runtime:'Browserbase',sync:'1 destination',updated:'6 min ago'},{id:'desk',name:'Shared · Verification desk',short:'Desk',initials:'VD',path:'/personas/verification-desk',location:'Geneva / CH',rev:9,timezone:'Europe/Zurich',locale:'en-US',runtime:'Local',sync:'1 destination',updated:'8 min ago'}];
const aInitial=[
{id:'facebook',p:'maya',site:'Facebook',domain:'facebook.com',user:'maya.research',glyph:'f',state:'help',reason:'Email code required',content:'Watchlist · 3 groups',runtime:'Local',ago:'2 min',rev:42},
{id:'instagram',p:'maya',site:'Instagram',domain:'instagram.com',user:'@maya.monitor',glyph:'◎',state:'good',reason:'Feed + account verified',content:'Following feed',runtime:'Local',ago:'4 min',rev:42},
{id:'x',p:'maya',site:'X',domain:'x.com',user:'@maya_eu',glyph:'𝕏',state:'cooldown',reason:'Rate limit · retry in 18m',content:'Research list',runtime:'Browserbase',ago:'7 min',rev:41},
{id:'tiktok',p:'maya',site:'TikTok',domain:'tiktok.com',user:'@maya.research',glyph:'♪',state:'help',reason:'CAPTCHA needs a person',content:'Following feed',runtime:'Browserbase',ago:'9 min',rev:41},
{id:'youtube',p:'maya',site:'YouTube',domain:'youtube.com',user:'maya.research@example.org',glyph:'▶',state:'good',reason:'Subscriptions visible',content:'Subscriptions',runtime:'Local',ago:'11 min',rev:42},
{id:'reddit',p:'maya',site:'Reddit',domain:'reddit.com',user:'u/maya_research',glyph:'r',state:'good',reason:'Private community visible',content:'Private research community',runtime:'Local',ago:'12 min',rev:42},
{id:'linkedin',p:'maya',site:'LinkedIn',domain:'linkedin.com',user:'Maya K.',glyph:'in',state:'good',reason:'Feed + account verified',content:'Home feed',runtime:'Local',ago:'14 min',rev:42},
{id:'noah-fb',p:'noah',site:'Facebook',domain:'facebook.com',user:'noah.monitor',glyph:'f',state:'good',reason:'Watchlist visible',content:'Regional watchlist',runtime:'Browserbase',ago:'6 min',rev:18},
{id:'noah-x',p:'noah',site:'X',domain:'x.com',user:'@noah_research',glyph:'𝕏',state:'good',reason:'Research list visible',content:'Research list',runtime:'Browserbase',ago:'8 min',rev:18},
{id:'noah-reddit',p:'noah',site:'Reddit',domain:'reddit.com',user:'u/noah_research',glyph:'r',state:'good',reason:'Community visible',content:'Research community',runtime:'Browserbase',ago:'12 min',rev:18},
{id:'desk-yt',p:'desk',site:'YouTube',domain:'youtube.com',user:'verification@example.org',glyph:'▶',state:'good',reason:'Subscriptions visible',content:'Subscriptions',runtime:'Local',ago:'8 min',rev:9},
{id:'desk-li',p:'desk',site:'LinkedIn',domain:'linkedin.com',user:'Verification Desk',glyph:'in',state:'good',reason:'Feed visible',content:'Home feed',runtime:'Local',ago:'14 min',rev:9}];
let personas=structuredClone(pInitial),accounts=structuredClone(aInitial),destinations=[{id:'archivebox',name:'ArchiveBox · Geneva',kind:'ArchiveBox',direction:'Push & pull',status:'Current',scope:'Native profile + portable state',rev:42,personas:['maya','desk'],endpoint:'/archivebox/data/personas'},{id:'browserbase',name:'Browserbase · Research',kind:'Browserbase',direction:'Push & pull',status:'Review changes',scope:'Cookies + supported origin storage',rev:41,personas:['maya','noah'],endpoint:'Project: research-eu'},{id:'extension',name:'Maya’s browser extension',kind:'Browser extension',direction:'Pull only',status:'Current',scope:'Cookies + browser preferences',rev:42,personas:['maya'],endpoint:'Paired browser: Maya / Chrome'}];
let ui={route:'persona',persona:'maya',account:'facebook',tab:'revisions',filter:'all',query:'',group:'site',expanded:['maya'],expandedSites:['facebook.com','x.com'],wizard:null,step:1,draft:{},toast:'',selectedDestination:'browserbase',syncApplied:false,recoveryDone:false,preview:false,paused:false,sessionFinished:false};
Object.assign(ui,{runId:'106',compareBase:'7d2b6e1',compareHead:'c940ef2',diffType:'all',diffPage:0});
let design={density:'Compact',navigation:true};
let recoveryConnections=[];
const configDefaults={appearance:'Light',viewport:'1440 × 900',scale:'1× / 100%',useragent:'Match pinned runtime build',motion:'No preference',geolocation:'Deny by default'};
function restore(snapshot){const s=snapshot?.privateContent;if(!s||s.version!==2)return;if(['overview','personas','checks','sessions','sync','settings','persona','account','compare'].includes(s.route))ui.route=s.route;if(personas.some(p=>p.id===s.persona))ui.persona=s.persona;if(accounts.some(a=>a.id===s.account))ui.account=s.account;if(['accounts','config','revisions','destinations'].includes(s.tab))ui.tab=s.tab;if(['persona','site'].includes(s.group))ui.group=s.group;}
restore(window.openai?.widgetState);
function remember(){window.openai?.setWidgetState({modelContent:{screen:ui.route,groupBy:ui.group,persona:personas.find(p=>p.id===ui.persona)?.name,account:accounts.find(a=>a.id===ui.account)?.site,density:design.density,prototype:true},privateContent:{version:2,route:ui.route,persona:ui.persona,account:ui.account,tab:ui.tab,group:ui.group}})?.catch(()=>{});}
const pBy=id=>personas.find(p=>p.id===id)||personas[0];const aBy=id=>accounts.find(a=>a.id===id)||accounts[0];
const health=a=>a.state==='good'?badge('Accessible','good'):a.state==='help'?badge('Needs help','warn'):a.state==='draft'?badge('Not checked'):badge('Cooling down','info');
const counts=()=>({good:accounts.filter(a=>a.state==='good').length,help:accounts.filter(a=>a.state==='help').length,cooldown:accounts.filter(a=>a.state==='cooldown').length});
const title=(name,sub,actions='')=>`<div class="ac-row ac-between"><div><h1>${esc(name)}</h1><p class="ac-subtitle">${esc(sub)}</p></div><div class="ac-row">${actions}</div></div>`;
const field=(name,label,value='',type='text',hint='')=>`<label class="ac-field"><span>${esc(label)}</span><input class="ac-input" name="${name}" type="${type}" value="${esc(value)}" ${['name','domain','identity','endpoint','prompt'].includes(name)?'required':''}>${hint?`<small class="ac-muted">${esc(hint)}</small>`:''}</label>`;
const select=(name,label,values,current)=>`<label class="ac-field"><span>${esc(label)}</span><select class="ac-input" name="${name}">${values.map(v=>{const value=typeof v==='string'?v:v.value;const text=typeof v==='string'?v:v.label;return `<option value="${esc(value)}" ${value===current?'selected':''}>${esc(text)}</option>`}).join('')}</select></label>`;
function spark(a){if(a.state==='draft')return '<small class="ac-muted">No runs</small>';return `<div class="ac-spark" aria-label="Last 8 example checks: ${a.state==='good'?'all passed':'most recent needs attention'}">${Array.from({length:8},(_,i)=>`<span class="${i===7&&a.state==='help'?'ac-sparkbad':i===7&&a.state==='cooldown'?'ac-sparkwarn':''}"></span>`).join('')}</div>`;}
function accountRows(list,bySite=false){return `<div class="ac-tablewrap"><table><thead><tr><th>${bySite?'Persona / account':'Site / account'}</th><th>Content access</th><th>Last check</th><th>Runtime / revision</th><th>History</th></tr></thead><tbody>${list.map(a=>`<tr><td><div class="ac-sitecell"><span class="${bySite?'ac-avatar':'ac-platform'}">${bySite?pBy(a.p).initials:a.glyph}</span><div>${link(bySite?pBy(a.p).name:a.site,'account:'+a.id)}<span class="ac-detail-line">${esc(a.user)}</span></div></div></td><td>${health(a)}<span class="ac-detail-line">${esc(a.reason)}</span></td><td>${a.state==='draft'?'Never':esc(a.ago)+' ago'}<span class="ac-detail-line">${esc(a.content)}</span></td><td>${esc(a.runtime)}<span class="ac-detail-line">r${a.rev}${a.rev<pBy(a.p).rev?' · newer leader':''}</span></td><td>${spark(a)}</td></tr>`).join('')}</tbody></table></div>`;}
function personaGroups(filtered){return personas.map(p=>{const list=filtered.filter(a=>a.p===p.id);if(!list.length)return '';const total=accounts.filter(a=>a.p===p.id);const expanded=ui.expanded.includes(p.id)||ui.query||ui.filter!=='all';return `<div class="ac-personagroup"><div class="ac-row"><button class="ac-btn ac-btn-quiet" aria-label="${expanded?'Collapse':'Expand'} ${esc(p.name)}" aria-expanded="${!!expanded}" data-action="expand:${p.id}">${ic(expanded?'chevron-down':'chevron-right')}</button><span class="ac-avatar">${p.initials}</span><div>${link(p.name,'persona:'+p.id)}<span class="ac-detail-line ac-mono">${esc(p.path)} · ${esc(p.location)}</span></div></div><div class="ac-row"><small class="ac-muted">${total.filter(a=>a.state==='good').length}/${total.length} accessible</small>${badge('Leader '+leaderFor(p.id))}</div></div>${expanded?accountRows(list):''}`}).join('')||'<div class="ac-empty">No accounts match this view.</div>';}
function siteGroups(filtered){return [...new Set(accounts.map(a=>a.domain))].map(domain=>{const list=filtered.filter(a=>a.domain===domain);if(!list.length)return '';const total=accounts.filter(a=>a.domain===domain);const good=total.filter(a=>a.state==='good').length;const help=total.filter(a=>a.state==='help').length;const cooling=total.filter(a=>a.state==='cooldown').length;const draft=total.filter(a=>a.state==='draft').length;const expanded=ui.expandedSites.includes(domain)||ui.query||ui.filter!=='all';const summary=good===total.length?'All accounts accessible':help===total.length?'All accounts need help':[help?help+' need help':'',cooling?cooling+' cooling down':'',draft?draft+' not checked':''].filter(Boolean).join(' · ');return `<div class="ac-personagroup"><div class="ac-row"><button class="ac-btn ac-btn-quiet" aria-label="${expanded?'Collapse':'Expand'} ${esc(total[0].site)} accounts" aria-expanded="${!!expanded}" data-action="expand-site:${domain}">${ic(expanded?'chevron-down':'chevron-right')}</button><span class="ac-platform">${total[0].glyph}</span><div><strong>${esc(total[0].site)}</strong><span class="ac-detail-line">${esc(domain)} · ${new Set(total.map(a=>a.p)).size} ${new Set(total.map(a=>a.p)).size===1?'persona':'personas'}</span></div></div><div class="ac-row"><small class="ac-muted">${summary}</small>${badge(good+'/'+total.length+' accessible',good===total.length?'good':help===total.length?'bad':'warn')}</div></div>${expanded?accountRows(list,true):''}`}).join('')||'<div class="ac-empty">No accounts match this view.</div>';}
function overview(){const c=counts();const attention=accounts.find(a=>a.state==='help');const filtered=accounts.filter(a=>(ui.filter==='all'||(ui.filter==='attention'?a.state!=='good':a.state==='good'))&&`${a.site} ${a.user} ${pBy(a.p).name}`.toLowerCase().includes(ui.query.toLowerCase()));return title('Access overview','Your user accounts, checked against the content that matters.',btn('New persona','new:persona','plus',true))+`<div class="ac-metrics"><button class="ac-metric" data-action="filter:good"><span class="ac-metriclabel">Accounts accessible ${ic('shield-check')}</span><span class="ac-value">${c.good}<small> / ${accounts.length}</small></span><small class="ac-muted">Identity + content verified</small></button><button class="ac-metric" data-action="filter:attention"><span class="ac-metriclabel">Need your attention ${ic('hand')}</span><span class="ac-value">${c.help}</span><small class="ac-muted">${c.help?accounts.filter(a=>a.state==='help').map(a=>a.reason.includes('Email')?'Email code':'CAPTCHA').join(' · '):'No open requests'}</small></button><button class="ac-metric" data-action="nav:sync"><span class="ac-metriclabel">Checked-out copies ${ic('git-branch')}</span><span class="ac-value">${checkoutRuns.filter(r=>r.outcome==='active').length}</span><small class="ac-muted">Browserbase + Local Chrome</small></button></div>
${c.help?`<div class="ac-banner"><div class="ac-row">${ic('mail')}<span><strong>${esc(attention.site)} needs your help.</strong><br><small>${esc(pBy(attention.p).short)} · ${esc(attention.reason)} · recovery paused</small></span></div>${btn('Review recovery','account:'+attention.id,'arrow-up-right')}</div>`:''}
<div class="ac-toolbar"><div class="ac-row"><div class="ac-grouping" role="group" aria-label="Group accounts by"><span>Group by</span><button type="button" aria-pressed="${ui.group==='persona'}" data-action="group:persona">${ic('users')}Persona</button><button type="button" aria-pressed="${ui.group==='site'}" data-action="group:site">${ic('globe')}Site</button></div><label class="ac-search">${ic('search')}<input id="ac-search" aria-label="Search accounts" placeholder="Find an account…" value="${esc(ui.query)}"></label></div><div class="ac-row"><select class="ac-input" id="ac-filter" aria-label="Account status filter" style="width:auto"><option value="all" ${ui.filter==='all'?'selected':''}>All statuses</option><option value="attention" ${ui.filter==='attention'?'selected':''}>Needs attention</option><option value="good" ${ui.filter==='good'?'selected':''}>Accessible</option></select>${btn('New check','new:check','plus')}</div></div>
<div class="ac-panel" style="margin-top:0">${ui.group==='site'?siteGroups(filtered):personaGroups(filtered)}<div class="ac-activityline">${ic('activity')}<span>${c.cooldown} account cooling down · next scheduled check in 4 min</span><span style="margin-left:auto">${link('View check queue','nav:checks')}</span></div></div>
<div class="ac-footer"><span>Health is scoped to the checked runtime and revision.</span><span>Example workspace · 03 Oct, 09:42</span></div>`;}
function personaList(){return title('Personas','One canonical identity. Independent browser forks for every use.',btn('New persona','new:persona','plus',true))+`<div class="ac-panel ac-personacards">${personas.map(p=>{const list=accounts.filter(a=>a.p===p.id);return `<div class="ac-personacard"><div class="ac-row ac-between"><div class="ac-row"><span class="ac-avatar">${p.initials}</span><div>${link(p.name,'persona:'+p.id)}<span class="ac-detail-line ac-mono">${esc(p.path)} · ${esc(p.location)}</span></div></div>${btn('Open persona','persona:'+p.id,'arrow-up-right')}</div><div class="ac-mini-stats"><span><strong>${list.filter(a=>a.state==='good').length}/${list.length}</strong> accounts accessible</span><span><strong>r${p.rev}</strong> current leader</span><span><strong>${p.runtime}</strong> preferred runtime</span><span>${providerLinks.filter(d=>d.personas.includes(p.id)).length} providers</span></div><div class="ac-row">${list.map(a=>`<button class="ac-btn ac-btn-quiet" data-action="account:${a.id}">${a.glyph} ${esc(a.site)} ${badge(a.state==='good'?'OK':a.state==='help'?'Help':a.state==='draft'?'New':'Wait',a.state==='good'?'good':a.state==='help'?'warn':'')}</button>`).join('')||'<small class="ac-muted">No sites added yet</small>'}</div></div>`}).join('')}</div><div class="ac-banner ac-neutral">${ic('folder-sync')}<span>ArchiveBox collections discovered: <strong>/archivebox/data</strong></span>${btn('Import a persona','new:persona','download')}</div>`;}
function personaDetail(){const p=pBy(ui.persona);const list=accounts.filter(a=>a.p===p.id);return `<div class="ac-breadcrumb">${link('Personas','nav:personas')} / ${esc(p.short)}</div>`+title(p.name,`${p.path} · ${p.location}`,btn('New site','new:site','plus',true))+`<div class="ac-banner ac-neutral"><div class="ac-row">${ic('git-branch')}<span><strong>Leader ${leaderFor(p.id)}</strong> · latest eligible successful check-in<br><small>Failed and unknown runs stay on their branches · scoped site leaders tracked separately</small></span></div>${btn('Check out copy','checkout:'+p.id,'git-branch')}</div><div class="ac-tabs" role="tablist" aria-label="Persona sections">${[['accounts','Accounts',list.length],['config','Browser config',''],['revisions','Lineage',''],['destinations','Providers','']].map(([id,label,n])=>`<button class="ac-tab ${ui.tab===id?'ac-active':''}" id="ac-tab-${id}" role="tab" aria-selected="${ui.tab===id}" aria-controls="ac-persona-panel" data-action="tab:${id}">${label}${n!==''?' · '+n:''}</button>`).join('')}</div><div role="tabpanel" id="ac-persona-panel" aria-labelledby="ac-tab-${ui.tab}">${ui.tab==='accounts'?`<div class="ac-panel">${list.length?accountRows(list):'<div class="ac-empty">Add a site to define this persona’s first access check.</div>'}</div><div class="ac-footer"><span>Account identity is verified separately from content access.</span>${link('Create a content check','new:check')}</div>`:ui.tab==='config'?configView(p):ui.tab==='revisions'?revisionView(p):destinationCards(p.id)}</div>`;}
function configView(p){const cfg={...configDefaults,...p.config};return `<form id="ac-configform"><div class="ac-grid2"><section class="ac-panel"><div class="ac-panelhead"><h2>Browser identity</h2>${badge('Desired configuration')}</div><div class="ac-panelbody ac-fields">${select('runtime','Default runtime',['Local','Browserbase'],p.runtime)}${select('locale','Language / locale',['en-GB','en-US','fr-CH','ar'],p.locale)}${field('timezone','Timezone',p.timezone)}${select('appearance','Color preference',['Light','Dark','System'],cfg.appearance)}${field('viewport','Viewport',cfg.viewport)}${field('scale','Device scale / zoom',cfg.scale)}<div class="ac-fieldwide">${field('useragent','User agent policy',cfg.useragent,'text','Observed UA and client hints must agree.')}</div>${select('motion','Reduced motion',['No preference','Reduce'],cfg.motion)}${select('geolocation','Geolocation',['Deny by default','Persona location'],cfg.geolocation)}</div></section><div><section class="ac-panel"><div class="ac-panelhead"><h2>Observed on last run</h2>${badge('Local · r'+p.rev,'good')}</div><div class="ac-panelbody"><dl class="ac-keyvalues"><dt>Chrome</dt><dd>153 · pinned image</dd><dt>Timezone</dt><dd>${esc(pInitial.find(x=>x.id===p.id)?.timezone||'Not observed')}</dd><dt>Locale</dt><dd>${esc(pInitial.find(x=>x.id===p.id)?.locale||'Not observed')}</dd><dt>Viewport</dt><dd>1440 × 900</dd><dt>Proxy / egress</dt><dd>Geneva · stable route</dd><dt>Parity</dt><dd>${badge(p.configEdited?'Recheck pending':'6 required fields match',p.configEdited?'warn':'good')}</dd></dl></div></section><section class="ac-panel"><div class="ac-panelhead"><h2>Storage coverage</h2>${link('Compare runtimes','nav:sync')}</div><div class="ac-panelbody ac-stack"><div class="ac-row ac-between"><span>Cookies · localStorage</span>${badge('Verified','good')}</div><div class="ac-row ac-between"><span>sessionStorage restore</span>${badge('Required','info')}</div><div class="ac-row ac-between"><span>IndexedDB · OPFS</span>${badge('Local native profile')}</div><small class="ac-muted">Browserbase portability is shown per destination.</small></div></section></div></div><div class="ac-formfooter"><span class="ac-muted">Saved config applies to new forks.</span><button class="ac-btn ac-btn-primary" type="button" data-action="submit-form">${ic('check')}Save configuration</button></div></form>`;}
function checksView(){return title('Checks','Small, repeatable proofs that the right account can see the right content.',btn('New check','new:check','plus',true))+`<div class="ac-toolbar"><div class="ac-row">${badge(accounts.length+' enabled checks','good')}${badge('1 respecting backoff','info')}</div>${btn(ui.paused?'Resume schedule':'Pause schedule','pause','pause')}</div>${ui.paused?'<div class="ac-banner">Scheduling paused in this prototype.</div>':''}<div class="ac-panel"><div class="ac-tablewrap"><table><thead><tr><th>Content check</th><th>Persona / account</th><th>Latest result</th><th>Cadence</th><th>Next</th></tr></thead><tbody>${accounts.map(a=>`<tr><td>${link(a.content,'account:'+a.id)}<span class="ac-detail-line">${a.state==='draft'?'Awaiting first run':'Identity · visibility · blocker detection'}</span></td><td>${esc(pBy(a.p).short)} · ${esc(a.site)}<span class="ac-detail-line">${esc(a.user)}</span></td><td>${health(a)}<span class="ac-detail-line">${esc(a.ago)} ago · ${esc(a.runtime)} r${a.rev}</span></td><td>${esc(a.check?.cadence||'Every 30 minutes')}<span class="ac-detail-line">+ on state change</span></td><td>${a.state==='help'?badge('Paused','warn'):a.state==='cooldown'?'18 min':ui.paused?'Paused':'4 min'}</td></tr>`).join('')}</tbody></table></div></div><div class="ac-footer"><span>Fast rechecks follow changes. Repeated failures increase backoff.</span><span>${link('Agent & tool settings','nav:settings')}</span></div>`;}
function accountView(){const a=aBy(ui.account),p=pBy(a.p),need=a.state==='help',email=a.id==='facebook';return `<div class="ac-breadcrumb">${link(p.name,'persona:'+p.id)} / ${esc(a.site)}</div>`+title(`${a.site} · ${a.user}`,a.domain+' · '+a.content,btn('Edit check','edit:check','sliders-horizontal')+btn('Run check','run:'+a.id,'play',true))+`<div class="ac-toolbar"><div class="ac-row">${health(a)}${badge(a.runtime+' · r'+a.rev)}${badge(a.state==='draft'?'No check yet':'Checked '+a.ago+' ago')}</div>${link('Account settings','edit:site')}</div>${need?`<div class="ac-banner"><div class="ac-row">${ic(email?'mail':'hand')}<span><strong>${esc(a.reason)}</strong><br><small>${email?'No matching email connection is available. A person can complete this challenge.':'The check is paused. Continue in the browser, then verify access again.'}</small></span></div>${btn('Open recovery','recover:'+a.id,'arrow-up-right')}</div>`:a.state==='cooldown'?`<div class="ac-banner ac-neutral">${ic('timer')}<span>Rate limited · automatic retries resume in 18 minutes.</span>${badge('Backoff active','info')}</div>`:''}
<div class="ac-grid2"><section class="ac-panel"><div class="ac-panelhead"><h2>Latest access proof</h2>${badge(a.state==='good'?'Passed':'Incomplete',a.state==='good'?'good':'warn')}</div><div class="ac-panelbody ac-stack">${[['Account identity',a.state==='good'?'Expected account found':'Not confirmed',a.state==='good'],['Target content',a.state==='good'?'Expected feed items visible':'Not visible',a.state==='good'],['Obstructions',a.state==='good'?'No blocking overlay':a.reason,a.state==='good'],['Freshness',a.state==='good'?'Content loaded during this run':'No content proof',a.state==='good']].map(([k,v,ok])=>`<div class="ac-row ac-between"><span>${k}</span><span class="ac-row" style="color:var(--ac-${ok?'green':'amber'})">${ic(ok?'circle-check':'circle-dashed')}<small>${esc(v)}</small></span></div>`).join('')}<hr class="ac-quietrule"><div class="ac-row ac-between"><span class="ac-muted">Evidence bundle</span>${btn('Inspect evidence','evidence','scan-eye')}</div><small class="ac-muted">Screenshot · matched text · runtime fingerprint · check version</small></div></section><section class="ac-panel"><div class="ac-panelhead"><h2>Check definition</h2>${badge('v3')}</div><div class="ac-panelbody ac-stack"><p>${esc(a.check?.prompt||('Open '+a.content.toLowerCase()+'. Confirm '+a.user+' is signed in, and at least 3 posts are visible without a blocking overlay.'))}</p><dl class="ac-keyvalues"><dt>Schedule</dt><dd>${esc(a.check?.cadence||'Every 30 minutes')}</dd><dt>Target</dt><dd class="ac-mono">${esc(a.check?.url||a.url||'https://'+a.domain+'/')}</dd><dt>Recovery</dt><dd>Known fixes → agent → person</dd><dt>Secret reference</dt><dd class="ac-mono">${esc(a.secret||'op://Research/'+a.site+'/…')}</dd></dl></div></section></div><section class="ac-panel"><div class="ac-panelhead"><h2>Check & recovery timeline</h2>${badge('All times local')}</div>${event('scan-eye','Content check '+(a.state==='good'?'passed':'found a blocker'),`${a.runtime} · r${a.rev} · identity and content checked separately`,a.ago+' ago',a.state!=='good')}${a.state==='good'?event('circle-check','Access verified','3 content assertions passed · no human action needed','31m ago'):event('workflow','Recovery stopped at a handoff',email?'Email code needed · no eligible mailbox connection':'Site challenge requires a person','3m ago',true)}${event('git-branch','Profile forked from leader',`Isolated working profile · canonical data untouched during the run`,'4m ago')}</section>`;}
function event(icon,heading,detail,time,alert=false){return `<div class="ac-event"><span class="ac-eventicon ${alert?'ac-alerticon':''}">${ic(icon)}</span><div>${esc(heading)}<span class="ac-detail-line">${esc(detail)}</span></div><span class="ac-eventtime">${esc(time)}</span></div>`;}
function settingsView(){return title('Agent & tools','Bring an existing agent workspace. Keep credentials behind scoped tools.')+`<div class="ac-grid2"><section class="ac-panel"><div class="ac-panelhead"><h2>Agent workspace</h2>${badge('OpenCode','good')}</div><div class="ac-panelbody ac-stack"><div class="ac-row ac-between"><span>Inference provider</span><strong>Configured in OpenCode</strong></div><div class="ac-row ac-between"><span>Workspace endpoint</span><code class="ac-mono">localhost:4096</code></div>${btn('Preview agent handoff','agent','arrow-up-right',true)}<small class="ac-muted">Chat, model setup, sessions and terminal belong to the existing agent UI.</small></div></section><section class="ac-panel"><div class="ac-panelhead"><h2>Local classification</h2>${badge('Candidate model')}</div><div class="ac-panelbody ac-stack"><div class="ac-row ac-between"><span>Blocker detection</span><strong>Rules → small local model</strong></div><div class="ac-row ac-between"><span>Remote escalation</span>${badge('Redacted page evidence only')}</div><div class="ac-row ac-between"><span>Email matching</span>${badge('Local only','good')}</div><small class="ac-muted">Model accuracy and CPU latency need evaluation.</small></div></section></div><section class="ac-panel"><div class="ac-panelhead"><h2>Recovery connections</h2>${btn('Add connection','new:connection','plus')}</div><div class="ac-tablewrap"><table><thead><tr><th>Connection</th><th>Access</th><th>Status</th><th></th></tr></thead><tbody><tr><td>1Password · Research vault</td><td>Scoped secret handles · OTP retrieval</td><td>${badge('Example connection','good')}</td><td>${link('Configure','connection:1Password')}</td></tr><tr><td>Email · user inbox</td><td>Read recent challenge emails locally</td><td>${badge('Not connected','warn')}</td><td>${link('Connect','connection:Email')}</td></tr>${recoveryConnections.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.kind)} · scoped reference</td><td>${badge('Awaiting authorization','warn')}</td><td>${link('Configure','connection:'+c.kind)}</td></tr>`).join('')}<tr><td>Human help</td><td>In-app recovery requests</td><td>${badge('Enabled','good')}</td><td>${link('Preferences','connection:Human help')}</td></tr></tbody></table></div></section><section class="ac-panel"><div class="ac-panelhead"><h2>Recovery boundaries</h2></div><div class="ac-panelbody"><div class="ac-settingsrow"><div><strong>Read and maintain access</strong><span class="ac-detail-line">Sign-in, approved consent choices, and content verification.</span></div>${badge('Enabled','good')}</div><div class="ac-settingsrow"><div><strong>Posting, liking, following, messaging</strong><span class="ac-detail-line">Outside this workspace’s purpose.</span></div>${badge('Unavailable')}</div><div class="ac-settingsrow"><div><strong>Unknown challenge or account restriction</strong><span class="ac-detail-line">Pause the account and request a person.</span></div>${badge('Human handoff','warn')}</div></div></section>`;}
function stepper(labels){return `<div class="ac-stepper">${labels.map((l,i)=>`${i?'<span class="ac-stepdivider"></span>':''}<span class="ac-step ${ui.step===i+1?'ac-current':''}"><b>${i+1}</b>${l}</span>`).join('')}</div>`;}
function wizard(){const d=ui.draft;let heading='',sub='',body='',labels=['Details','Review'],next='Review',final=ui.step===2;const pOptions=personas.map(p=>({value:p.id,label:p.name}));
if(ui.wizard==='persona'){heading='Create a persona';sub='Give one user identity a canonical home.';body=ui.step===1?`<div class="ac-fields">${field('name','Persona name',d.name||'')}${field('location','Location label',d.location||'Geneva / CH')}${select('source','Starting state',['Import from ArchiveBox','Pair browser extension','Create empty profile'],d.source||'Import from ArchiveBox')}${select('runtime','Preferred runtime',['Local','Browserbase'],d.runtime||'Local')}<div class="ac-fieldwide">${field('path','Source profile path',d.path||'/archivebox/data/personas/','text','Source is copied into the canonical store; each use gets a new fork.')}</div>${select('locale','Language / locale',['en-GB','en-US','fr-CH','ar'],d.locale||'en-GB')}${field('timezone','Timezone',d.timezone||'Europe/Zurich')}</div>`:`<div class="ac-stack"><dl class="ac-keyvalues"><dt>Persona</dt><dd>${esc(d.name)}</dd><dt>Source</dt><dd>${esc(d.source)}</dd><dt>Canonical location</dt><dd class="ac-mono">/personas/${slug(d.name)}</dd><dt>Default runtime</dt><dd>${esc(d.runtime)}</dd><dt>Browser settings</dt><dd>${esc(d.locale)} · ${esc(d.timezone)}</dd></dl><div class="ac-banner ac-neutral">${ic('git-branch')}<span>New persona → initial checkpoint → independent checkouts → latest eligible successful check-in leads.</span></div><small class="ac-muted">Prototype creation adds a sample persona. No profile is read from disk.</small></div>`;
}else if(ui.wizard==='site'){heading=d.edit?'Edit site account':'Add a site account';sub='Attach the expected account identity and its recovery references.';body=ui.step===1?`<div class="ac-fields">${select('persona','Persona',pOptions,d.persona||ui.persona)}${field('domain','Site domain',d.domain||'facebook.com')}${field('identity','Expected username / email',d.identity||'')}${field('secret','1Password reference',d.secret||'op://Research/','text','A reference only. Passwords and codes are resolved by the trusted executor.')}<div class="ac-fieldwide">${field('url','Known accessible content URL',d.url||'https://facebook.com/','url')}</div>${select('mailbox','Challenge mailbox',['Not connected','Connect in Agent & tools'],'Not connected')}${select('consent','Cookie consent preference',['Necessary only','Ask a person'],'Necessary only')}</div>`:`<div class="ac-stack"><dl class="ac-keyvalues"><dt>Persona</dt><dd>${esc(pBy(d.persona).name)}</dd><dt>Site</dt><dd>${esc(d.domain)}</dd><dt>Expected identity</dt><dd>${esc(d.identity)}</dd><dt>Content URL</dt><dd>${esc(d.url)}</dd><dt>Secret</dt><dd class="ac-mono">${esc(d.secret)}</dd></dl><div class="ac-banner ac-neutral">${ic('circle-dashed')}<span>Access stays “Not checked” until identity and content assertions pass.</span></div></div>`;
}else if(ui.wizard==='check'){heading=d.edit?'Edit access check':'Create an access check';sub='Describe success, inspect the assertions, then try an example run.';labels=['Describe','Assertions','Preview'];final=ui.step===3;next=ui.step===1?'Generate assertions':'Preview example run';if(ui.step===1){body=`<div class="ac-fields">${select('account','Site account',accounts.map(a=>({value:a.id,label:pBy(a.p).short+' · '+a.site+' · '+a.user})),d.account||ui.account)}${field('name','Check name',d.name||'Research feed access')}<label class="ac-field ac-fieldwide"><span>What should be accessible?</span><textarea class="ac-input" name="prompt" required>${esc(d.prompt||'Go to my research feed. Make sure I am signed in as the expected account and at least three posts are visible. Detect login walls and blocking popups.')}</textarea></label><div class="ac-fieldwide">${field('url','Target URL',d.url||'https://facebook.com/','url')}</div>${select('cadence','Schedule',['Every 30 minutes','Every hour','Before collection only'],d.cadence||'Every 30 minutes')}${select('runtime','Run on',['Persona default','Local','Browserbase'],d.runtime||'Persona default')}</div>`;}else if(ui.step===2){body=`<div class="ac-banner ac-neutral">${ic('sparkles')}<span>Example translation · edit each assertion before saving.</span></div><div class="ac-stack">${field('identityAssertion','Account identity',d.identityAssertion||'Expected username is present in the account menu')}${field('contentAssertion','Content visibility',d.contentAssertion||'At least 3 post containers contain visible text')}${field('blockerAssertion','Blockers',d.blockerAssertion||'No login, consent, CAPTCHA or promotional overlay blocks the feed')}<label class="ac-checkbox"><input name="humanUnknown" type="checkbox" checked><span>Pause and ask a person when the blocker is unknown.</span></label><label class="ac-field"><span>Generated script preview · illustrative</span><textarea class="ac-input ac-mono" name="script" rows="7">${esc(d.script||`await page.goto(${JSON.stringify(d.url||'https://facebook.com/')});\nawait verifyIdentity(expectedAccount);\nawait verifyVisibleContent({ minimumPosts: 3 });\nawait detectBlockingOverlays();\nawait saveEvidence();`)}</textarea></label></div>`;}else{body=`<div class="ac-banner ac-success">${ic('circle-check')}<span><strong>Example preview passed</strong> · no browser was launched</span></div><div class="ac-stack"><dl class="ac-keyvalues"><dt>Check</dt><dd>${esc(d.name)}</dd><dt>Account</dt><dd>${esc(aBy(d.account).site)} · ${esc(aBy(d.account).user)}</dd><dt>Runtime</dt><dd>${esc(d.runtime)}</dd><dt>Schedule</dt><dd>${esc(d.cadence)}</dd></dl>${['Account identity matched','3 visible posts found','No blocking overlay detected'].map(t=>`<div class="ac-row">${ic('circle-check')}<span>${t}</span></div>`).join('')}<small class="ac-muted">Saving creates a local prototype definition; production checks will require a real runtime trial.</small></div>`;}
}else if(ui.wizard==='destination'){heading=d.edit?'Edit provider':'Connect a provider';sub='Allow a provider to check out copies and return checkpoints with run outcomes.';labels=['Provider','Connection','Checkout policy'];final=ui.step===3;next=ui.step===2?'Preview connection & continue':'Continue';if(ui.step===1){body=`<div class="ac-choicegrid">${[['ArchiveBox','hard-drive','Collection on a local host'],['Browserbase','cloud','Remote browsers over CDP'],['Browser extension','puzzle','Pull human browser changes'],['Local profile directory','folder','Import / export native profiles']].map(([k,i,t])=>`<button type="button" class="ac-choice" aria-pressed="${(d.kind||'Browserbase')===k}" data-action="choose:${k}">${ic(i)}<strong>${k}</strong><small class="ac-muted">${t}</small></button>`).join('')}<button type="button" class="ac-choice" disabled>${ic('cloud')}<strong>Kernel</strong><small class="ac-muted">Later · adapter stub</small></button><button type="button" class="ac-choice" disabled>${ic('cloud')}<strong>Browserless</strong><small class="ac-muted">Later · adapter stub</small></button></div>`;}else if(ui.step===2){const kind=d.kind||'Browserbase';body=`<div class="ac-fields">${field('name','Provider name',d.name||kind+' · Research')}${field('endpoint',kind==='Browserbase'?'Browserbase project ID':kind==='Browser extension'?'Pairing label':'Collection / profile path',d.endpoint||'')}<div class="ac-fieldwide">${field('credential','Credential reference',d.credential||'op://Infrastructure/Browserbase/API key','text','Reference only. The browser never receives a provider API key.')}</div>${select('region','Region',['EU','US','Local host'],d.region||'EU')}${select('persona','Persona available for checkout',pOptions,d.persona||ui.persona)}</div><div class="ac-banner ac-neutral">${ic('plug')}<span>Connection preview uses sample capabilities. No provider API is contacted.</span></div>`;}else{const limited=(d.kind||'Browserbase')==='Browserbase';body=`<div class="ac-stack"><div class="ac-row ac-between"><strong>${esc(d.name)}</strong>${badge('Example connection ready','good')}</div><div class="ac-fields">${select('direction','Permissions',d.kind==='Browser extension'?['Import only']:['Checkout & check-in','Checkout only'],d.direction||'Checkout & check-in')}${select('trigger','Check-in policy',['Success + no issues + checks passed','Manual review of every return'],d.trigger||'Success + no issues + checks passed')}</div>${field('origins','Allowed origins',d.origins||'facebook.com, instagram.com, x.com','text','No transfer outside the selected origin scope.')}<div class="ac-scope">State carried with each copy</div>${[['cookies','Cookies',true],['local','localStorage',true],['session','sessionStorage restore',true],['indexed','IndexedDB + OPFS',!limited]].map(([id,label,enabled])=>`<label class="ac-checkbox"><input name="${id}" type="checkbox" ${enabled?'checked':'disabled'}><span>${label}${!enabled?' · unsupported until verified':''}</span></label>`).join('')}<div class="ac-banner ac-neutral">${ic('git-compare')}<span>Check-ins are retained for inspection. Only clean, verified success can advance the relevant leader.</span></div></div>`;}
}else{heading='Connect a recovery tool';sub='Resolve codes and secrets without copying them into prompts or stored scripts.';body=ui.step===1?`<div class="ac-fields">${select('kind','Connection type',['Email','1Password','Human help'],d.kind||'Email')}${field('name','Connection name',d.name||'Research inbox')}${select('transport','Email transport',['Gmail read-only API','IMAP read-only / PEEK'],d.transport||'Gmail read-only API')}${field('credential','Credential reference',d.credential||'op://Research/Mail/OAuth')}<div class="ac-fieldwide">${field('recipient','Allowed recipient',d.recipient||'researcher@example.org','email')}</div></div><div class="ac-banner ac-neutral">${ic('shield-check')}<span>Recent challenge messages are matched locally by site, recipient, request time and expiry.</span></div>`:`<div class="ac-stack"><dl class="ac-keyvalues"><dt>Connection</dt><dd>${esc(d.name)}</dd><dt>Type</dt><dd>${esc(d.kind)}</dd><dt>Credential</dt><dd class="ac-mono">${esc(d.credential)}</dd><dt>Recipient scope</dt><dd>${esc(d.recipient)}</dd></dl>${badge('Example configuration only')}<small class="ac-muted">No OAuth flow, vault, or mailbox is accessed by this prototype.</small></div>`;}
return `<div class="ac-breadcrumb">${link('Back to workspace','cancel')}</div>`+title(heading,sub)+stepper(labels)+`<form id="ac-wizardform"><section class="ac-panel"><div class="ac-panelhead"><h2>${labels[ui.step-1]}</h2>${badge('Interactive prototype')}</div><div class="ac-panelbody">${body}<div id="ac-formerror" role="alert" class="ac-error"></div></div><div class="ac-formfooter">${btn(ui.step===1?'Cancel':'Back',ui.step===1?'cancel':'back','arrow-left')}<button class="ac-btn ac-btn-primary" type="button" data-action="submit-form">${final?'Save '+(d.edit?'changes':ui.wizard==='connection'?'connection':ui.wizard==='destination'?'provider':ui.wizard):next}${ic(final?'check':'arrow-right')}</button></div></section></form>`;
}

function diffStates(base,head){const a=checkpointStore[base]?.state||{},b=checkpointStore[head]?.state||{};const changes=[];for(const type of ['cookies','settings','storage','files']){const before=a[type]||{},after=b[type]||{};for(const key of new Set([...Object.keys(before),...Object.keys(after)])){const av=before[key],bv=after[key];if(JSON.stringify(av)===JSON.stringify(bv))continue;changes.push({type,key,before:av,after:bv,op:av===undefined?'added':bv===undefined?'removed':'updated'});}}return changes;}
function changeSummary(base,head){const d=diffStates(base,head);return ['cookies','settings'].map(type=>{const changes=d.filter(x=>x.type===type);const parts=['added','updated','removed'].map(op=>{const n=changes.filter(x=>x.op===op).length;return n?(op==='added'?'+':op==='removed'?'−':'~')+n:''}).filter(Boolean);return parts.length?parts.join(' ')+' '+type:''}).filter(Boolean).join(' · ')||'No cookie or setting changes';}
function outcomeBadge(r){return r.outcome==='success'?badge('Successful','good'):r.outcome==='failed'?badge('Failed · retained','bad'):r.outcome==='unknown'?badge('Unknown · retained','warn'):badge('Running','info');}

  let dots='';for(const e of lineageEvents){const r=e.run?runBy(e.run):null;const col=e.kind==='failed'?'var(--ac-red)':e.kind==='active'?'var(--ac-blue)':r?color(r):'var(--ac-green)';const cy=y(e.id),cx=lane(e.lane);dots+=`<circle cx="${cx}" cy="${cy}" r="${e.kind==='checkout'?4:5}" fill="${e.kind==='checks'?'var(--ac-surface)':col}" stroke="${col}" stroke-width="2"/>`;if(e.kind==='failed')dots+=`<path d="M ${cx-2} ${cy-2} l 4 4 M ${cx+2} ${cy-2} l -4 4" stroke="var(--ac-surface)" stroke-width="1.5"/>`;}

function compareView(){const valid=Object.keys(checkpointStore);if(!checkpointStore[ui.compareBase])ui.compareBase='7d2b6e1';if(!checkpointStore[ui.compareHead])ui.compareHead=leaderFor('maya');const base=checkpointStore[ui.compareBase],head=checkpointStore[ui.compareHead];const all=diffStates(base.hash,head.hash),changes=all.filter(d=>ui.diffType==='all'||d.type===ui.diffType);const choices=valid.map(h=>({value:h,label:h+' · '+checkpointStore[h].message+' · '+checkpointStore[h].author}));const count=op=>all.filter(d=>d.op===op).length;const shown=changes.slice(ui.diffPage*15,ui.diffPage*15+15);return title('Compare checkpoints','One comparison view for imports, branches, check-ins, and leader changes.',btn('Persona lineage','history:'+head.p,'git-branch'))+`<div class="ac-comparepick"><label class="ac-field"><span>Base checkpoint</span><select class="ac-input ac-mono" id="ac-compare-base">${choices.map(x=>`<option value="${x.value}" ${x.value===base.hash?'selected':''}>${esc(x.label)}</option>`).join('')}</select></label>${btn('Swap','compare-swap','arrow-left-right')}<label class="ac-field"><span>Compare checkpoint</span><select class="ac-input ac-mono" id="ac-compare-head">${choices.map(x=>`<option value="${x.value}" ${x.value===head.hash?'selected':''}>${esc(x.label)}</option>`).join('')}</select></label></div><div class="ac-compare-cards">${[base,head].map(c=>`<div class="ac-endpoint"><div class="ac-row">${badge(c.hash===leaderFor(c.p)?'Persona leader':c.outcome==='failed'?'Failed branch':c.outcome==='active'?'Active checkpoint':c.outcome==='imported'?'Imported':'Checkpoint',c.hash===leaderFor(c.p)?'good':c.outcome==='failed'?'bad':'')}<code class="ac-mono">${c.hash}</code></div><strong>${esc(c.message)}</strong><small class="ac-muted">${esc(c.author)} · ${c.time} · ${esc(pBy(c.p).short)}</small><small>${Object.keys(c.state.cookies).length} cookies · ${Object.keys(c.state.settings).length} settings</small>${c.source?`<small class="ac-mono">${esc(c.source)}<br>${esc(c.host)} · ${esc(c.cdp)}</small>`:''}</div>`).join('')}</div><div class="ac-toolbar"><div class="ac-row">${badge(count('added')+' added','good')}${badge(count('updated')+' changed','info')}${badge(count('removed')+' removed','bad')}</div><select class="ac-input" style="width:auto" id="ac-diff-type" aria-label="Change category">${['all','cookies','settings','storage','files'].map(t=>`<option value="${t}" ${ui.diffType===t?'selected':''}>${t==='all'?'All changes':t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select></div>${base.p!==head.p?'<div class="ac-banner">Different personas · comparison only. No state is combined.</div>':''}${head.outcome==='failed'?'<div class="ac-banner"><strong>Failed branch · retained for inspection · not eligible for automatic promotion</strong></div>':''}<section class="ac-panel" style="margin-top:0"><div class="ac-panelhead"><h2>Semantic state diff</h2>${badge('Secret values redacted')}</div><div class="ac-tablewrap"><table class="ac-diff-table"><thead><tr><th>Field / origin</th><th>Base · ${base.hash}</th><th>Compare · ${head.hash}</th></tr></thead><tbody>${shown.map(d=>`<tr><td><span class="ac-row">${badge(d.op,d.op==='added'?'good':d.op==='removed'?'bad':'info')}<strong>${esc(d.type==='cookies'?(d.after||d.before).name:d.key)}</strong></span><span class="ac-detail-line">${esc(d.type==='cookies'?(d.after||d.before).domain+' · path / · unpartitioned':d.type)}</span></td><td class="${d.before!==undefined?'ac-diff-before':''}">${diffValue(d,d.before)}</td><td class="${d.after!==undefined?'ac-diff-after':''}">${diffValue(d,d.after)}</td></tr>`).join('')||'<tr><td colspan="3" class="ac-empty">No differences in this selection.</td></tr>'}</tbody></table></div><div class="ac-panelhead" style="border-bottom:0;border-top:1px solid var(--ac-line)"><small class="ac-muted">${changes.length?ui.diffPage*15+1:0}–${Math.min((ui.diffPage+1)*15,changes.length)} of ${changes.length} changes</small><div class="ac-row">${btn('Previous','diff-pr function checkinView(){const r=runBy(ui.runId)||runBy('106');return `<div class="ac-breadcrumb">${link(providerName(r.provider)+' #'+r.id,'run:'+r.id)} / Check in</div>`+title('Check in persona',pBy(r.p).name+' · returning '+r.tip+' from '+r.base)+`<form id="ac-checkinform"><section class="ac-panel"><div class="ac-panelhead"><h2>Run report</h2>${badge(r.scope==='persona'?'Persona-wide':r.scope+' only')}</div><div class="ac-panelbody ac-stack"><div class="ac-fields">${select('outcome','Overall run outcome',['Success','Failed','Unknown'],'Success')}${field('notes','Outcome notes','')}</div><label class="ac-checkbox"><input name="hadIssues" type="checkbox"><span>Any issue occurred during the run, even if a later step recovered.</span></label><label class="ac-checkbox"><input name="checksPassed" type="checkbox" checked><span>Every required identity and content check passed for this scope.</span></label><label class="ac-checkbox"><input name="exportComplete" type="checkbox" checked><span>Returned state is complete, validated, and durably stored.</span></label><div class="ac-banner ac-neutral" id="ac-eligibility" role="status"></div><div class="ac-row ac-between"><span>${changeSummary(r.base,r.tip)}</span>${btn('Inspect checkpoint diff','compare-pair:'+r.base+':'+r.tip,'git-compare')}</div></div><div class="ac-formfooter">${btn('Back to run','run:'+r.id,'arrow-left')}<button type="button" class="ac-btn ac-btn-primary" data-action="submit-form">${ic('git-pull-request')}Check in example copy</button></div></section></form>`;}
function eligibility(){const f=root.querySelector('#ac-checkinform');if(!f)return;const r=runBy(ui.runId)||runBy('106');const ok=f.elements.outcome.value==='Success'&&!f.elements.hadIssues.checked&&f.elements.checksPassed.checked&&f.elements.exportComplete.checked&&!r.errors.length;f.querySelector('#ac-eligibility').textContent=ok?'Eligible: this successful check-in can advance the '+(r.scope==='persona'?'persona':r.scope)+' leader.':'Not eligible: retain the check-in for inspection; keep the current leader.';return ok;}
function nextHistoryTime(){const t=historySeconds++;return [Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(x=>String(x).padStart(2,'0')).join(':');}
function commitCheckin(f){const r=runBy(ui.runId)||runBy('106');if(r.outcome!=='active')return;const ok=eligibility(),hadIssues=f.elements.hadIssues.checked,outcome=f.elements.outcome.value;const oldLeader=r.scope==='persona'?leaderFor(r.p):heads[r.p]?.sites[r.scope]||leaderFor(r.p);r.outcome=ok?'success':outcome==='Unknown'?'unknown':'failed';r.ended=nextHistoryTime();r.checks=f.elements.checksPassed.checked?(r.scope==='persona'?'7/7 passed':'Site checks passed'):'Incomplete';r.errors=[...(hadIssues?['An issue was reported during the run']:[]),...(outcome==='Failed'?['Run reported failure']:[]),...(!f.elements.checksPassed.checked?['Required checks did not pass']:[]),...(!f.elements.exportComplete.checked?['Final export incomplete']:[]),...(outcome==='Unknown'?['Outcome unknown']:[])];r.durable=f.elements.exportComplete.checked;checkpointStore[r.tip].outcome=r.outcome;if(ok){if(r.scope==='persona'){heads[r.p].persona=r.tip;for(const site of Object.keys(heads[r.p].sites))heads[r.p].sites[site]=r.tip;}else heads[r.p].sites[r.scope]=r.tip;}if(r.p==='maya'){lineageEvents.push({id:ok?'in'+r.id:'failed'+r.id,kind:ok&&r.scope==='persona'?'checkin':ok?'site-checkin':'failed',time:r.ended,label:'#'+r.id+' checked in · '+(ok?r.scope==='persona'?'promoted to persona leader':'promoted to '+r.scope+' leader':'not promoted'),detail:ok?changeSummary(oldLeader,r.tip):'Returned checkpoint retained · persona leader unchanged',run:r.id,lane:ok&&r.scope==='persona'?0:r.lane,hash:r.tip,previous:oldLeader});}ui.toast=ok?'Example check-in accepted. '+(r.scope==='persona'?'Persona leader advanced to '+r.tip: r.scope+' leader advanced; persona leader unchanged.'):'Example check-in retained. Run was not cleanly successful, so the leader did not move.';ui.route='session';}

function createCheckout(f){const p=pBy(ui.persona),provider=f.elements.provider.value,scope=f.elements.scope.value,base=scope==='persona'?leaderFor(p.id):heads[p.id]?.sites[scope]||leaderFor(p.id);const now=nextHistoryTime(),id=String(300+historyCounter++),tip=('da'+id+'e1').slice(0,7);checkpointStore[tip]={...structuredClone(checkpointStore[base]),hash:tip,parent:base,time:now,author:providerName(provider)+' #'+id,message:'Checkout working checkpoint',outcome:'active',run:id};const used=new Set(checkoutRuns.filter(r=>r.p===p.id&&r.outcome==='active').map(r=>r.lane));const lane=[1,2,3,4,5].find(x=>!used.has(x));if(!lane){ui.toast='This example graph displays up to five concurrent branches. Check in an active copy first.';ui.route='sessions';return;}checkoutRuns.push({id,p:p.id,provider,consumer:provider==='local'?'ArchiveBox':'Session Tender',base,tip,lane,checkout:now,ended:null,outcome:'active',scope,checks:'In progress',errors:[],durable:false});if(p.id==='maya'){lineageEvents.push({id:'out'+id,kind:'checkout',time:now,label:providerName(provider)+' checked out #'+id,detail:'Forked from '+base+' · '+(scope==='persona'?'persona leader':scope+' leader'),runs:[id],lane:0,hash:base},{id:'active'+id,kind:'active',time:now,label:'#'+id+' · running',detail:'Independent copy · awaiting check-in',run:id,lane,hash:tip});}ui.runId=id;ui.route='session';ui.toast='Example checkout '+id+' started from '+base+'.';}

function historyAction(action,parts){const value=parts[0];if(action==='compare'||action==='compare-to'||action==='compare-pair'){
  if(action==='compare-to'){const c=checkpointStore[value];if(!c)return true;ui.compareBase=c.parent||value;ui.compareHead=value;}
  else if(action==='compare-pair'){ui.compareBase=value;ui.compareHead=parts[1];}
  else{ui.compareBase='7d2b6e1';ui.compareHead=leaderFor('maya');}
  ui.diffPage=0;ui.diffType='all';ui.route='compare';ui.wizard=null;return true;
}if(action==='compare-swap'){[ui.compareBase,ui.compareHead]=[ui.compareHead,ui.compareBase];ui.diffPage=0;return true;}
if(action==='diff-next'){ui.diffPage++;return true;}if(action==='diff-prev'){ui.diffPage=Math.max(0,ui.diffPage-1);return true;}
if(action==='history'){ui.persona=value;ui.route='persona';ui.tab='revisions';ui.wizard=null;return true;}
if(action==='run'&&runBy(value)){ui.runId=value;ui.persona=runBy(value).p;ui.route='session';ui.wizard=null;return true;}
if(action==='checkin'){ui.runId=value;ui.route=runBy(value)?.outcome==='active'?'checkin':'session';return true;}
if(action==='checkout'||action==='fork'){ui.persona=value||'maya';ui.checkoutProvider=ui.selectedDestination==='local'?'local':'browserbase';ui.route='checkout';ui.wizard=null;return true;}
if(action==='session'){ui.runId=value==='archivebox'?'218':value==='noah'?'201':'106';ui.route='session';return true;}
if(action==='finish'){ui.runId='218';ui.route=runBy('218').outcome==='active'?'checkin':'session';return true;}
if(action==='review-sync'){ui.compareBase='7d2b6e1';ui.compareHead=leaderFor('maya');ui.diffType='all';ui.diffPage=0;ui.route='compare';return true;}
if(action==='apply-sync'){ui.toast='Use a run check-in report to evaluate promotion eligibility.';return true;}return false;}

if(e.target.closest('#ac-checkinform')){eligibility();return true;}if(e.target.closest('#ac-checkoutform')){const scope=e.target.closest('form').elements.scope.value;const base=scope==='persona'?leaderFor(ui.persona):heads[ui.persona]?.sites[scope]||leaderFor(ui.persona);root.querySelector('#ac-checkout-base').textContent='Checkout base: '+base+' · '+(scope==='persona'?'persona leader':heads[ui.persona]?.sites[scope]?scope+' leader':'persona leader fallback; site is not verified');return true;}return false;}

function render(){const routeNames={overview:'Overview',personas:'Personas',persona:'Personas',checks:'Checks',account:'Checks',sessions:'Checkouts',session:'Checkouts',sync:'Providers',destination:'Providers',compare:'Compare',checkout:'Checkouts',checkin:'Checkouts',settings:'Agent & tools',agent:'Agent & tools',recover:'Recovery',evidence:'Evidence'};const nav=[['overview','Overview','layout-dashboard',''],['personas','Personas','users',personas.length],['checks','Checks','list-checks',accounts.length],['sessions','Checkouts','monitor',checkoutRuns.filter(r=>r.outcome==='active').length],['sync','Providers','cloud',''],['compare','Compare','git-compare',''],['settings','Agent & tools','blocks','']];const pages={overview,personas:personaList,persona:personaDetail,checks:checksView,account:accountView,sessions:sessionsView,sync:syncView,destination:destinationView,settings:settingsView,recover:recoveryView,compare:compareView,checkout:checkoutView,checkin:checkinView,evidence:evidenceView,agent:agentView,session:sessionView};root.style.setProperty('--ac-row',design.density==='Compact'?'10px':'16px');root.innerHTML=`<div class="ac-shell" ${design.navigation?'':'style="grid-template-columns:1fr"'}><aside class="ac-sidebar" ${design.navigation?'':'hidden'}><div class="ac-brand"><span class="ac-brandmark">${ic('scan-face')}</span><span>Session Tender<small>ArchiveBox</small></span></div><div class="ac-workspace"><div class="ac-eyebrow">Workspace</div><div style="margin-top:4px;font-weight:550">Research operations</div><small class="ac-muted">Local canonical store</small></div><div><div class="ac-eyebrow ac-navlabel" style="padding:0 10px 10px">Workspace</div><nav aria-label="Main navigation">${nav.map(([id,label,icon,num])=>`<button type="button" class="ac-navitem ${routeNames[ui.route]===routeNames[id]?'ac-active':''}" data-action="nav:${id}" ${routeNames[ui.route]===routeNames[id]?'aria-current="page"':''}>${ic(icon)}<span>${label}</span><span class="ac-navcount">${num}</span></button>`).join('')}</nav></div><div class="ac-sidebarfooter"><div class="ac-row"><span class="ac-presence"></span>Example worker online</div><div class="ac-user"><span class="ac-avatar">MK</span><span>Maya K.<br><small>Workspace admin</small></span></div></div></aside><main class="ac-main"><header class="ac-topbar"><div class="ac-row"><span>Research operations</span>${ic('chevron-right')}<span>${ui.wizard?'Create':routeNames[ui.route]||'Overview'}</span></div><div class="ac-row">${badge('Interactive prototype')}<span>Example data</span>${btn('Reset','reset','rotate-ccw')}</div></header>${ui.toast?`<div class="ac-toast" role="status">${ic('circle-check')}<span>${esc(ui.toast)}</span><button type="button" class="ac-btn ac-btn-quiet" style="margin-left:auto" data-action="dismiss" aria-label="Dismiss message">${ic('x')}</button></div>`:''}<div class="ac-content">${ui.wizard?wizard():(pages[ui.route]||overview)()}</div></main></div>`;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});drawLineage();eligibility();}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'new-persona';}
function openWizard(type,edit=false){ui.wizard=type;ui.step=1;ui.draft={edit};ui.returnRoute=ui.route;ui.toast='';if(type==='site'&&edit){const a=aBy(ui.account);ui.draft={edit,persona:a.p,domain:a.domain,identity:a.user,url:a.url||'https://'+a.domain+'/',secret:a.secret||'op://Research/'+a.site+'/…'};}if(type==='check'){const a=aBy(ui.account);ui.draft={edit,account:a.id,name:edit?a.content:'',url:a.url||'https://'+a.domain+'/',prompt:edit?`Open ${a.content}. Confirm ${a.user} is signed in and at least three posts are visible.`:'',...(edit?a.check||{}:{})};}if(type==='destination'&&edit){const d=destinations.find(x=>x.id===ui.selectedDestination);ui.draft={edit,id:d.id,kind:d.kind,name:d.name,endpoint:d.endpoint,persona:d.personas[0],direction:d.direction};}}
function saveWizard(){const d=ui.draft;if(ui.wizard==='persona'){const id=slug(d.name)+'-'+(personas.length+1);personas.push({id,name:d.name,short:d.name,initials:d.name.slice(0,2).toUpperCase(),path:'/personas/'+slug(d.name),location:d.location,rev:1,timezone:d.timezone,locale:d.locale,runtime:d.runtime,sync:'No destinations',updated:'Just now'});ui.persona=id;ui.tab='accounts';ui.route='persona';ui.toast='Example persona created. Add its first site account.';}else if(ui.wizard==='site'){let a;if(d.edit){a=aBy(ui.account);Object.assign(a,{p:d.persona,domain:d.domain,user:d.identity,url:d.url,secret:d.secret,state:'draft',reason:'Definition changed · recheck required'});}else{a={id:'site-'+Date.now(),p:d.persona,site:d.domain.replace(/^www\./,'').split('.')[0],domain:d.domain,user:d.identity,glyph:d.domain[0].toUpperCase(),url:d.url,secret:d.secret,state:'draft',reason:'First check required',content:'Content access',runtime:pBy(d.persona).runtime,ago:'0 min',rev:pBy(d.persona).rev};accounts.push(a);}ui.account=a.id;ui.persona=a.p;ui.route='account';ui.toast='Example site saved. Access is not yet verified.';}else if(ui.wizard==='check'){const a=aBy(d.account);a.content=d.name;a.check={...d};a.state='draft';a.reason='New definition · first run required';ui.account=a.id;ui.route='account';ui.toast='Example check saved. Run it to collect access proof.';}else if(ui.wizard==='destination'){const dest={id:d.id||'destination-'+Date.now(),name:d.name,kind:d.kind||'Browserbase',endpoint:d.endpoint,direction:d.direction||'Push & pull',status:'Awaiting first sync',scope:[d.cookies?'Cookies':'',d.local?'localStorage':'',d.session?'sessionStorage':'',d.indexed?'IndexedDB + OPFS':''].filter(Boolean).join(' + '),rev:0,personas:[d.persona]};if(d.edit)destinations=destinations.map(x=>x.id===dest.id?dest:x);else destinations.push(dest);providerLinks.push({id:dest.id,name:dest.name,kind:dest.kind,personas:dest.personas,endpoint:dest.endpoint});ui.selectedDestination=dest.id;ui.route='destination';ui.toast='Example provider configured. No copies have been checked out yet.';}else{recoveryConnections.push({...d});ui.route='settings';ui.toast='Example recovery connection saved. Production authorization remains a separate step.';}ui.wizard=null;ui.step=1;}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const [action,...rest]=b.dataset.action.split(':');const value=rest.join(':');if(action==='submit-form'){submitForm(b.closest('form'));return;}if(historyAction(action,rest)){render();remember();return;}if(action==='nav'){ui.route=value;ui.wizard=null;ui.toast='';}else if(action==='account'){ui.account=value;ui.persona=aBy(value).p;ui.route='account';ui.wizard=null;ui.toast='';}else if(action==='persona'){ui.persona=value;ui.tab='revisions';ui.route='persona';ui.wizard=null;}else if(action==='tab'){ui.tab=value;}else if(action==='expand'){ui.expanded=ui.expanded.includes(value)?ui.expanded.filter(x=>x!==value):[...ui.expanded,value];}else if(action==='group'){ui.group=value;}else if(action==='expand-site'){ui.expandedSites=ui.expandedSites.includes(value)?ui.expandedSites.filter(x=>x!==value):[...ui.expandedSites,value];}else if(action==='filter'){ui.filter=value;}else if(action==='new'){openWizard(value);}else if(action==='edit'){openWizard(value,true);}else if(action==='back'){const f=root.querySelector('#ac-wizardform');if(f)Object.assign(ui.draft,Object.fromEntries(new FormData(f)));ui.step=Math.max(1,ui.step-1);}else if(action==='cancel'){ui.wizard=null;ui.route=ui.returnRoute||'overview';}else if(action==='choose'){ui.draft.kind=value;}else if(action==='recover'){ui.account=value;ui.route='recover';ui.wizard=null;}else if(action==='complete-challenge'){const a=aBy(ui.account);a.state='good';a.reason='Recovery verified in example';a.ago='0 min';a.rev=pBy(a.p).rev;ui.toast='Example recovery completed. Facebook verification saved; the failed attempt cannot automatically promote the persona leader.';destinations.filter(d=>d.personas.includes(a.p)).forEach(d=>d.status='Awaiting sync');}else if(action==='destination'){ui.selectedDestination=value;ui.route='destination';ui.wizard=null;}else if(action==='pause'){ui.paused=!ui.paused;}else if(action==='run'){const a=aBy(value);ui.toast=a.state==='cooldown'?'Example check remains deferred until backoff expires.':a.state==='help'?'Example run found the same blocker. Open recovery to continue.':'Example run passed. Identity and content assertions are visible below.';if(a.state==='draft'){a.state='good';a.reason='Example content assertions passed';a.ago='0 min';}ui.route='account';ui.account=value;}else if(action==='evidence'){ui.route='evidence';}else if(action==='agent'){ui.route='agent';}else if(action==='revisions'){ui.route='persona';ui.tab='revisions';}else if(action==='connection'){openWizard('connection');ui.draft.kind=value;}else if(action==='dismiss'){ui.toast='';}else if(action==='reset'){buildHistory();personas=structuredClone(pInitial);accounts=structuredClone(aInitial);recoveryConnections=[];destinations=[{id:'archivebox',name:'ArchiveBox · Geneva',kind:'ArchiveBox',direction:'Push & pull',status:'Current',scope:'Native profile + portable state',rev:42,personas:['maya','desk'],endpoint:'/archivebox/data/personas'},{id:'browserbase',name:'Browserbase · Research',kind:'Browserbase',direction:'Push & pull',status:'Review changes',scope:'Cookies + supported origin storage',rev:41,personas:['maya','noah'],endpoint:'Project: research-eu'},{id:'extension',name:'Maya’s browser extension',kind:'Browser extension',direction:'Pull only',status:'Current',scope:'Cookies + browser preferences',rev:42,personas:['maya'],endpoint:'Paired browser: Maya / Chrome'}];ui={route:'persona',persona:'maya',account:'facebook',tab:'revisions',filter:'all',query:'',group:'site',expanded:['maya'],expandedSites:['facebook.com','x.com'],wizard:null,step:1,draft:{},toast:'',selectedDestination:'browserbase',syncApplied:false,recoveryDone:false,preview:false,paused:false,sessionFinished:false,runId:'106',compareBase:'7d2b6e1',compareHead:'c940ef2',diffType:'all',diffPage:0};}render();remember();});
function submitForm(f){if(!f||!f.reportValidity())return;if(f.id==='ac-checkinform'){commitCheckin(f);render();remember();return;}if(f.id==='ac-checkoutform'){createCheckout(f);render();remember();return;}if(f.id==='ac-configform'){const data=Object.fromEntries(new FormData(f));Object.assign(pBy(ui.persona),{runtime:data.runtime,locale:data.locale,timezone:data.timezone,config:data,configEdited:true});ui.toast='Example configuration saved for future forks. Existing sessions retain their starting configuration.';render();remember();return;}if(f.id!=='ac-wizardform')return;const data=Object.fromEntries(new FormData(f));for(const el of f.querySelectorAll('input[type=checkbox]'))data[el.name]=el.checked;Object.assign(ui.draft,data);if(ui.wizard==='site'&&ui.step===1&&!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(ui.draft.domain)){root.querySelector('#ac-formerror').textContent='Use a domain such as facebook.com, without a path.';return;}const max=['check','destination'].includes(ui.wizard)?3:2;if(ui.step<max)ui.step++;else saveWizard();render();remember();}
root.addEventListener('submit',e=>{e.preventDefault();submitForm(e.target);});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')&&e.target.closest('form')){e.preventDefault();submitForm(e.target.closest('form'));}});
root.addEventListener('change',e=>{if(historyChange(e))return;if(e.target.id==='ac-filter'){ui.filter=e.target.value;render();remember();}});
root.addEventListener('input',e=>{if(e.target.id==='ac-search'){const pos=e.target.selectionStart;ui.query=e.target.value;render();const input=root.querySelector('#ac-search');input.focus();input.setSelectionRange(pos,pos);}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
buildHistory();
render();
new ResizeObserver(()=>drawLineage()).observe(root);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'Row density',options:['Compact','Comfortable']});tweak.addToggle(design,'navigation',{label:'Show workspace sidebar'});}
