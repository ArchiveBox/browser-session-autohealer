{% extends 'base.html' %}{% block content %}<div class="heading"><h1>New {{'AI Session' if nav=='agents' else 'Browser Session'}}</h1></div><section class="sheet-wrap"><form method="post" class="type-editor">{% for error in form.non_field_errors %}<div class="error">{{error}}</div>{% endfor %}<label for="{{form.check.html_id}}">Check</label><select name="{{form.check.html_name}}" id="{{form.check.html_id}}" required>{% for value,label in form.check.field.choices %}<option value="{{value}}" {{'selected' if value|string==form.check.value()|string else ''}}>{{label}}</option>{% endfor %}</select>{% for error in form.check.errors %}<div class="error">{{error}}</div>{% endfor %}<div class="actions"><button class="primary">▶ Start</button><a class="btn" href="/?view={{nav}}">Cancel</a></div></form></section>{% endblock %}
