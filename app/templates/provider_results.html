<div class="sheet-provider-results">{% for result in tile.provider_results %}<div><a class="badge {{result.tone}}" href="{{result.url}}" title="{{time_label(result.at)}}">{{result.check.provider.name}} · {{result.label}}</a><form method="post" action="/"><input type="hidden" name="action" value="run"><input type="hidden" name="check_id" value="{{result.check.id}}"><button aria-label="Run {{tile.check.name}} on {{result.check.provider.name}}" title="Check now">↻</button></form><form method="post" action="/personas/{{persona_id}}/browser"><input type="hidden" name="check_id" value="{{result.check.id}}"><button aria-label="Open {{tile.check.name}} on {{result.check.provider.name}}" title="Open live browser">↗</button></form></div>{% endfor %}</div>
