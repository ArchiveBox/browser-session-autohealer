{% extends 'base.html' %}{% block content %}<div class="heading"><h1>{{'Edit' if rule else 'New'}} Rule</h1></div><section class="sheet-wrap"><form method="post" class="type-editor">{% for error in form.non_field_errors %}<p class="error">{{error}}</p>{% endfor %}<div class="type-fields">{% for name in ['source','status','state','target'] %}{% set field=form[name] %}<label for="{{field.html_id}}">{{{'source':'Task','target':'Next task','status':'Result','state':'Condition · optional'}.get(name)}}{% if name=='state' %}<input id="{{field.html_id}}" name="{{name}}" value="{{field.value() or ''}}" placeholder="login_required">{% else %}<select id="{{field.html_id}}" name="{{name}}">{% for value,label in field.field.choices %}<option value="{{value}}" {{'selected' if value|string==field.value()|string else ''}}>{{label}}</option>{% endfor %}</select>{% endif %}{% for error in field.errors %}<span class="error">{{error}}</span>{% endfor %}</label>{% endfor %}</div><div class="actions"><label><input type="checkbox" name="enabled" {{'checked' if form.enabled.value() else ''}}> Enabled</label><button class="primary">Save</button><a href="/tasks/rules">Cancel</a></div></form></section>{% endblock %}
